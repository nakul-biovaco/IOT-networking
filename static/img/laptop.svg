<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Screen Background Gradient -->
    <linearGradient id="nbScreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Aluminum Chassis Gradients -->
    <linearGradient id="nbLidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <linearGradient id="nbBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283141" />
      <stop offset="60%" stop-color="#1F2633" />
      <stop offset="100%" stop-color="#151A22" />
    </linearGradient>

    <!-- Keyboard Well Gradient -->
    <linearGradient id="nbKbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141821" />
      <stop offset="100%" stop-color="#0E1218" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="nbDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="nbNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="64" cy="110" rx="54" ry="7" fill="#000000" opacity="0.38" filter="blur(3.5px)" />

  <!-- ================= DISPLAY LID (UPRIGHT) ================= -->
  <g id="laptop-lid" filter="url(#nbDropShadow)">
    <!-- Outer Lid Frame -->
    <rect x="23" y="24" width="82" height="54" rx="4.5" fill="url(#nbLidGrad)" stroke="#3E4C5E" stroke-width="1.2" />

    <!-- Glass Display Area (Bezel-less style) -->
    <rect x="26" y="27" width="76" height="47" rx="2" fill="url(#nbScreenBg)" stroke="#111827" stroke-width="0.8" />

    <!-- WebCam Notch & Indicator -->
    <circle cx="64" cy="25.5" r="0.9" fill="#00F2FE" />
    <circle cx="67" cy="25.5" r="0.5" fill="#38EF7D" opacity="0.8" />

    <!-- Screen Network UI / Live Stream Dashboard -->
    <!-- Window Header -->
    <rect x="26" y="27" width="76" height="4.5" fill="#090E17" opacity="0.85" />
    <circle cx="29.5" cy="29.2" r="1.1" fill="#FF5F56" />
    <circle cx="33" cy="29.2" r="1.1" fill="#FFBD2E" />
    <circle cx="36.5" cy="29.2" r="1.1" fill="#27C93F" />
    <rect x="42" y="28.5" width="28" height="1.6" rx="0.8" fill="#1F2937" />

    <!-- Network Graph Visual on Screen -->
    <!-- Grid -->
    <line x1="30" y1="48" x2="98" y2="48" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2" />
    <line x1="30" y1="60" x2="98" y2="60" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2" />

    <!-- High-res Data Waves -->
    <path d="M 30 57 Q 42 42, 54 54 T 74 46 T 86 52 T 98 43" fill="none" stroke="#00F2FE" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 30 63 Q 44 56, 58 61 T 76 53 T 98 58" fill="none" stroke="#38EF7D" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- Active telemetry nodes -->
    <circle cx="54" cy="54" r="1.8" fill="#00F2FE" filter="url(#nbNeonGlow)" />
    <circle cx="74" cy="46" r="1.8" fill="#38EF7D" filter="url(#nbNeonGlow)" />
    <circle cx="86" cy="52" r="1.8" fill="#00F2FE" filter="url(#nbNeonGlow)" />

    <!-- System Info Pill on Screen -->
    <rect x="30" y="34" width="22" height="7" rx="1.5" fill="#0F172A" opacity="0.7" stroke="#1E293B" stroke-width="0.5" />
    <circle cx="33.5" cy="37.5" r="1.2" fill="#00E676" />
    <rect x="36.5" y="36.8" width="13" height="1.4" rx="0.7" fill="#E2E8F0" opacity="0.8" />

    <rect x="76" y="34" width="22" height="7" rx="1.5" fill="#0F172A" opacity="0.7" stroke="#1E293B" stroke-width="0.5" />
    <rect x="79" y="36.8" width="16" height="1.4" rx="0.7" fill="#38BDF8" opacity="0.85" />

    <!-- Screen Gloss Highlight (diagonal) -->
    <polygon points="26,27 60,27 38,74 26,74" fill="#FFFFFF" opacity="0.03" />

    <!-- Hinge Connection Bar -->
    <rect x="44" y="77" width="40" height="2.5" rx="1" fill="#111620" />
  </g>

  <!-- ================= BASE / KEYBOARD DECK (ISOMETRIC PERSPECTIVE) ================= -->
  <g id="laptop-base" filter="url(#nbDropShadow)">
    <!-- Main Bottom Chassis Deck -->
    <polygon points="12,104 22,77 106,77 116,104" fill="url(#nbBaseGrad)" stroke="#3E4C5E" stroke-width="1" />

    <!-- Keyboard Recessed Area -->
    <polygon points="25,93 30,80 98,80 103,93" fill="url(#nbKbGrad)" stroke="#11161F" stroke-width="0.8" />

    <!-- Illuminated Keys Rows (Modern Backlit Matrix) -->
    <!-- Row 1 -->
    <polygon points="31,82 97,82 96,84 32,84" fill="#202A38" />
    <!-- Row 2 -->
    <polygon points="30,85 98,85 97,87 29,87" fill="#202A38" />
    <!-- Row 3 -->
    <polygon points="28,88 100,88 99,90 27,90" fill="#202A38" />
    <!-- Row 4 -->
    <polygon points="26,91 102,91 101,93 25,93" fill="#202A38" />
    <!-- Key slot accents (Cyan backlight bleed) -->
    <line x1="34" y1="84.5" x2="94" y2="84.5" stroke="#00F2FE" stroke-width="0.4" opacity="0.45" />
    <line x1="32" y1="87.5" x2="96" y2="87.5" stroke="#00F2FE" stroke-width="0.4" opacity="0.45" />
    <line x1="30" y1="90.5" x2="98" y2="90.5" stroke="#00F2FE" stroke-width="0.4" opacity="0.45" />

    <!-- Precision Glass Trackpad -->
    <polygon points="53,102 55,95 73,95 75,102" fill="#18202A" stroke="#3A485A" stroke-width="0.7" />

    <!-- Front Chamfer Edge Highlight -->
    <polygon points="12,104 116,104 114,107 14,107" fill="#131821" stroke="#252F3D" stroke-width="0.8" />
    <line x1="14" y1="104.5" x2="114" y2="104.5" stroke="#4F5E73" stroke-width="0.8" />
    <!-- Thumb Open Notch -->
    <rect x="58" y="104.2" width="12" height="1.2" rx="0.6" fill="#38BDF8" opacity="0.7" />
  </g>
</svg>

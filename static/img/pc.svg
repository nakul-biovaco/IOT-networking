<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Screen Gradient -->
    <linearGradient id="pcScreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>

    <!-- Bezel & Tower Metallic Gradients -->
    <linearGradient id="pcChassisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B323D" />
      <stop offset="35%" stop-color="#1E232B" />
      <stop offset="100%" stop-color="#14181F" />
    </linearGradient>

    <linearGradient id="pcStandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <linearGradient id="pcGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#4FACFE" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pcAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="pcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pcDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="50" cy="112" rx="34" ry="6" fill="#000000" opacity="0.35" filter="blur(3px)" />
  <ellipse cx="101" cy="112" rx="16" ry="5" fill="#000000" opacity="0.35" filter="blur(3px)" />

  <!-- ================= MONITOR SETUP ================= -->
  <!-- Monitor Stand Base & Arm -->
  <g id="monitor-stand">
    <!-- Base Plate -->
    <ellipse cx="50" cy="103" rx="18" ry="4.5" fill="url(#pcStandGrad)" stroke="#4B5563" stroke-width="0.8" />
    <ellipse cx="50" cy="102" rx="12" ry="2.5" fill="#111827" opacity="0.4" />
    <!-- Stand Pillar -->
    <path d="M 47 70 L 53 70 L 52 101 L 48 101 Z" fill="url(#pcStandGrad)" stroke="#374151" stroke-width="0.7" />
  </g>

  <!-- Monitor Frame with Screen -->
  <g id="monitor" filter="url(#pcDropShadow)">
    <!-- Outer Bezel -->
    <rect x="12" y="24" width="76" height="52" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1.2" />

    <!-- Active Display Area -->
    <rect x="14.5" y="26.5" width="71" height="44" rx="2" fill="url(#pcScreenBg)" />

    <!-- High-Tech Enterprise Dashboard Screen Graphics -->
    <!-- Window Bar -->
    <rect x="14.5" y="26.5" width="71" height="5" fill="#0D1117" opacity="0.75" />
    <circle cx="18" cy="29" r="1.2" fill="#FF5F56" />
    <circle cx="21.5" cy="29" r="1.2" fill="#FFBD2E" />
    <circle cx="25" cy="29" r="1.2" fill="#27C93F" />

    <!-- Screen Network Graphs & Telemetry Lines -->
    <!-- Grid lines -->
    <line x1="20" y1="46" x2="80" y2="46" stroke="#4FACFE" stroke-width="0.4" opacity="0.25" />
    <line x1="20" y1="56" x2="80" y2="56" stroke="#4FACFE" stroke-width="0.4" opacity="0.25" />

    <!-- Wave 1 (Active Traffic) -->
    <path d="M 20 54 Q 28 36, 36 50 T 52 44 T 66 55 T 80 40" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" />
    <!-- Wave 2 (Secondary Stream) -->
    <path d="M 20 60 Q 30 52, 42 58 T 60 51 T 80 57" fill="none" stroke="#38EF7D" stroke-width="1" stroke-linecap="round" opacity="0.8" />

    <!-- Live Nodes on Screen -->
    <circle cx="36" cy="50" r="1.8" fill="#00F2FE" filter="url(#pcGlow)" />
    <circle cx="52" cy="44" r="1.8" fill="#38EF7D" filter="url(#pcGlow)" />
    <circle cx="66" cy="55" r="1.8" fill="#00F2FE" filter="url(#pcGlow)" />

    <!-- Mini Telemetry Cards on Screen -->
    <rect x="18" y="34" width="16" height="7" rx="1" fill="#000000" opacity="0.4" />
    <rect x="19.5" y="36" width="9" height="1.2" fill="#00F2FE" />
    <rect x="19.5" y="38.5" width="13" height="1" fill="#FFFFFF" opacity="0.7" />

    <!-- Monitor Chin with Logo -->
    <path d="M 12 70.5 L 88 70.5 L 88 74 A 2 2 0 0 1 86 76 L 14 76 A 2 2 0 0 1 12 74 Z" fill="#0D1117" />
    <circle cx="50" cy="73.2" r="1.2" fill="#00F2FE" opacity="0.8" />
  </g>

  <!-- Keyboard and Mouse on Desk -->
  <g id="peripherals">
    <!-- Slim Keyboard -->
    <polygon points="26,104 70,104 68,110 24,110" fill="#1C2128" stroke="#30363D" stroke-width="0.8" />
    <!-- Key rows illusion -->
    <line x1="28" y1="106" x2="68" y2="106" stroke="#485260" stroke-width="0.8" stroke-dasharray="1.5,1.2" />
    <line x1="26.5" y1="108" x2="67" y2="108" stroke="#485260" stroke-width="0.8" stroke-dasharray="1.5,1.2" />

    <!-- Precision Mouse -->
    <ellipse cx="78" cy="107" rx="3.5" ry="5.5" fill="#1C2128" stroke="#30363D" stroke-width="0.7" />
    <line x1="78" y1="102" x2="78" y2="105.5" stroke="#00F2FE" stroke-width="0.7" />
  </g>

  <!-- ================= TOWER WORKSTATION ================= -->
  <g id="workstation-tower" filter="url(#pcDropShadow)">
    <!-- Tower Main Body -->
    <rect x="91" y="44" width="23" height="64" rx="3.5" fill="url(#pcChassisGrad)" stroke="#30363D" stroke-width="1.2" />

    <!-- Tempered Glass Side Window with Interior RGB Accent -->
    <rect x="93" y="52" width="19" height="42" rx="2" fill="#0A0E14" stroke="#21262D" stroke-width="0.8" />
    <!-- Internal Glass Sheen / Reflection -->
    <polygon points="93,52 108,52 93,76" fill="url(#pcGlassGrad)" />

    <!-- Internal GPU / Cooler RGB Glow Strips -->
    <line x1="96" y1="62" x2="108" y2="62" stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round" filter="url(#pcGlow)" />
    <line x1="96" y1="74" x2="108" y2="74" stroke="#38EF7D" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    <line x1="96" y1="84" x2="106" y2="84" stroke="#00F2FE" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <circle cx="102" cy="68" r="4.5" stroke="#4FACFE" stroke-width="1" fill="none" opacity="0.5" />

    <!-- Front Bezel / Air Intake Slots -->
    <rect x="91" y="96" width="23" height="10" fill="#11161D" />
    <line x1="94" y1="98" x2="111" y2="98" stroke="#21262D" stroke-width="1" stroke-linecap="round" />
    <line x1="94" y1="101" x2="111" y2="101" stroke="#21262D" stroke-width="1" stroke-linecap="round" />
    <line x1="94" y1="104" x2="111" y2="104" stroke="#21262D" stroke-width="1" stroke-linecap="round" />

    <!-- Top Power Button & Front I/O Ports -->
    <circle cx="95.5" cy="48" r="1.5" fill="#00F2FE" filter="url(#pcGlow)" />
    <circle cx="100.5" cy="48" r="0.9" fill="#6B7280" />
    <rect x="104" y="47.2" width="4" height="1.6" rx="0.5" fill="#374151" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Screen OLED Gradient -->
    <linearGradient id="phScreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#022C43" />
      <stop offset="100%" stop-color="#051923" />
    </linearGradient>

    <!-- Titanium Body Gradient -->
    <linearGradient id="phBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Wallpaper Radial Burst -->
    <radialGradient id="phWallpaperGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="phDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="phNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="116" rx="30" ry="6" fill="#000000" opacity="0.4" filter="blur(3.5px)" />

  <!-- Hardware Buttons on Edge -->
  <!-- Volume Up -->
  <rect x="34.5" y="34" width="2" height="12" rx="1" fill="#475569" />
  <!-- Volume Down -->
  <rect x="34.5" y="49" width="2" height="12" rx="1" fill="#475569" />
  <!-- Power Button -->
  <rect x="91.5" y="38" width="2" height="16" rx="1" fill="#475569" />

  <!-- Phone Main Body Chassis -->
  <g id="phone-body" filter="url(#phDropShadow)">
    <!-- Outer Curved Frame -->
    <rect x="36" y="10" width="56" height="104" rx="16" fill="url(#phBodyGrad)" stroke="#475569" stroke-width="1.2" />

    <!-- Thin Edge Highlight Chamfer -->
    <rect x="37.5" y="11.5" width="53" height="101" rx="14.5" fill="none" stroke="#64748B" stroke-width="0.5" opacity="0.6" />

    <!-- Screen Bezel -->
    <rect x="38.5" y="12.5" width="51" height="99" rx="13.5" fill="#050811" />

    <!-- Active OLED Display -->
    <rect x="40.5" y="14.5" width="47" height="95" rx="11.5" fill="url(#phScreenBg)" />
    <!-- Wallpaper Ambient Glow -->
    <rect x="40.5" y="14.5" width="47" height="95" rx="11.5" fill="url(#phWallpaperGlow)" />

    <!-- Dynamic Island / Top Camera Pill -->
    <rect x="55" y="17.5" width="18" height="5" rx="2.5" fill="#000000" />
    <circle cx="68" cy="20" r="1.1" fill="#0F172A" stroke="#1E293B" stroke-width="0.5" />
    <circle cx="58" cy="20" r="0.8" fill="#00F2FE" opacity="0.6" />

    <!-- Top Status Bar Info -->
    <!-- Clock (10:42) -->
    <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.2" font-weight="700" fill="#E2E8F0">10:42</text>
    
    <!-- Wi-Fi 6 Icon -->
    <path d="M 76 21 A 3 3 0 0 1 81 21 M 77.2 22 A 1.8 1.8 0 0 1 79.8 22 M 78.5 22.8 A 0.4 0.4 0 0 1 78.5 23" stroke="#38BDF8" stroke-width="0.6" stroke-linecap="round" fill="none" />
    <!-- Battery Level -->
    <rect x="82.5" y="19" width="4.5" height="2.6" rx="0.6" fill="none" stroke="#E2E8F0" stroke-width="0.5" />
    <rect x="83" y="19.5" width="3.2" height="1.6" rx="0.4" fill="#00E676" />
    <rect x="87" y="19.8" width="0.5" height="1" fill="#E2E8F0" />

    <!-- Mobile Screen Network Telemetry Widgets -->
    <!-- Signal Status Pill -->
    <rect x="44" y="27" width="40" height="14" rx="3" fill="#091220" opacity="0.85" stroke="#1E293B" stroke-width="0.6" />
    <circle cx="50" cy="34" r="3" fill="#00C9FF" opacity="0.2" />
    <circle cx="50" cy="34" r="1.5" fill="#00E5FF" filter="url(#phNeonGlow)" />
    <rect x="56" y="31" width="18" height="2" rx="1" fill="#FFFFFF" opacity="0.9" />
    <rect x="56" y="34.5" width="24" height="1.6" rx="0.8" fill="#38BDF8" opacity="0.75" />

    <!-- Live Network Waves on Screen -->
    <path d="M 43 58 Q 50 48, 58 55 T 72 49 T 85 54" fill="none" stroke="#00F2FE" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 43 64 Q 52 58, 62 62 T 76 56 T 85 61" fill="none" stroke="#38EF7D" stroke-width="1.1" stroke-linecap="round" opacity="0.8" />
    <circle cx="58" cy="55" r="1.4" fill="#00F2FE" filter="url(#phNeonGlow)" />
    <circle cx="72" cy="49" r="1.4" fill="#38EF7D" filter="url(#phNeonGlow)" />

    <!-- Mini Metric Cards on Screen -->
    <rect x="44" y="69" width="18" height="18" rx="3" fill="#091220" opacity="0.85" stroke="#1E293B" stroke-width="0.6" />
    <circle cx="53" cy="75" r="2" stroke="#00F2FE" stroke-width="0.8" fill="none" />
    <rect x="47" y="80" width="12" height="1.5" rx="0.75" fill="#94A3B8" />
    <rect x="49" y="82.5" width="8" height="1.8" rx="0.9" fill="#00F2FE" />

    <rect x="66" y="69" width="18" height="18" rx="3" fill="#091220" opacity="0.85" stroke="#1E293B" stroke-width="0.6" />
    <path d="M 72 76 L 75 73 L 78 76" stroke="#38EF7D" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="69" y="80" width="12" height="1.5" rx="0.75" fill="#94A3B8" />
    <rect x="71" y="82.5" width="8" height="1.8" rx="0.9" fill="#38EF7D" />

    <!-- Home Navigation Bar Indicator -->
    <rect x="54" y="103" width="20" height="1.4" rx="0.7" fill="#FFFFFF" opacity="0.7" />

    <!-- Screen Glass Sheen -->
    <polygon points="40.5,14.5 68,14.5 45,95 40.5,95" fill="#FFFFFF" opacity="0.04" />
  </g>
</svg>
